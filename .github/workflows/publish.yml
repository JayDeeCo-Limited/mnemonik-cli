name: Publish public CLI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify both volumes and the broken-release control
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($identity.Owner.Value -ne 'S-1-5-32-544') { throw 'Wrong token' }
          $tgz = (Get-Item mnemonik-cli-7.104.3.tgz).FullName
          foreach ($state in @((Join-Path $env:RUNNER_TEMP 'cli-state'), (Join-Path $env:LOCALAPPDATA 'Mnemonik'))) {
            $env:MNEMONIK_STATE_DIR = $state
            Write-Output "STATE=$state"
            npm exec --yes --cache "$env:RUNNER_TEMP/cli-cache" --package "$tgz" -- mnemonik --help --json
            $cliExit = $LASTEXITCODE
            Write-Output "CANDIDATE_EXIT=$cliExit"
            foreach ($path in @($state, (Join-Path $state 'audit-tmp'))) {
              if (Test-Path $path) {
                $acl=Get-Acl -LiteralPath $path
                [pscustomobject]@{Path=$path;Owner=$acl.Owner;Access=@($acl.Access | Select-Object IdentityReference,FileSystemRights,IsInherited)} | ConvertTo-Json -Depth 4
              }
            }
            if ($cliExit -ne 0) { exit $cliExit }
          }
          $env:MNEMONIK_STATE_DIR = Join-Path $env:RUNNER_TEMP 'broken-state'
          npm exec --yes --cache "$env:RUNNER_TEMP/cli-cache" --package '@mnemonik/cli@7.104.0' -- mnemonik --help --json
          Write-Output "BROKEN_EXIT=$LASTEXITCODE"
          if ($LASTEXITCODE -eq 0) { throw 'Broken release unexpectedly passed' }
          exit 0
      - name: Native ACL behavior and revert controls
        shell: pwsh
        run: |
          tar -xzf mnemonik-cli-7.104.3.tgz
          node windows-acl-mutations.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

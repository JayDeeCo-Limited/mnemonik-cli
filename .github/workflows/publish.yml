name: Publish public CLI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Build and pack without npm publish
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-cli
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: node deploy/cli-public/build.mjs
      - name: Pack and refuse consumer lifecycle scripts
        run: |
          set -euo pipefail
          npm pack ./dist-package --json > pack.json
          tgz=$(node -p "require('./pack.json')[0].filename")
          tar -xOf "$tgz" package/package.json | node deploy/cli-public/lifecycle-gate.mjs
          sudo apt-get update && sudo apt-get install -y minisign
          minisign -Vm release-manifest.json -x release-manifest.json.minisig -P RWSBYwgbjz0qKB4/ToA3dywBiAlQeBjoQpib4OHdjP2nDbpQnOVqpPm0
          node -e "const p=require('./pack.json')[0],m=require('./release-manifest.json'),e=m.packages?.['@mnemonik/cli']; if(m.schemaVersion!==1||m.version!==p.version||e?.version!==p.version||e.integrity!==p.integrity) process.exit(1)"
          sha256sum "$tgz" > cli-digests.txt
          MNEMONIK_STATE_DIR="$RUNNER_TEMP/cli-state" npm exec --yes --cache "$RUNNER_TEMP/cli-cache" --package "./$tgz" -- mnemonik --help
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release-evidence
          path: |
            *.tgz
            pack.json
            cli-digests.txt
            release-manifest.json
            release-manifest.json.minisig
            dist-package/dist/sbom.json
            scanner-release.json
  windows-smoke:
    needs: build
    runs-on: windows-2025
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: cli-release-evidence
      - name: Launch the packed CLI in a fresh Windows profile state
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          if ($identity.Owner.Value -ne 'S-1-5-32-544') { throw 'Windows smoke requires an Administrators default-owner token' }
          $env:MNEMONIK_STATE_DIR = Join-Path $env:RUNNER_TEMP 'cli-state'
          $tgz = (Get-ChildItem *.tgz).FullName
          npm exec --yes --cache "$env:RUNNER_TEMP/cli-cache" --package "$tgz" -- mnemonik --help --json
          $cliExit = $LASTEXITCODE
          if ($cliExit -ne 0) {
            foreach ($path in @($env:MNEMONIK_STATE_DIR, (Split-Path $env:MNEMONIK_STATE_DIR))) {
              if (Test-Path -LiteralPath $path) {
                $acl = Get-Acl -LiteralPath $path
                [pscustomobject]@{Path=$path;Owner=$acl.Owner;Access=@($acl.Access | Select-Object IdentityReference,FileSystemRights,AccessControlType,IsInherited)} | ConvertTo-Json -Depth 4
              } else { Write-Output "State path does not exist: $path" }
            }
            exit $cliExit
          }
  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@v7
        with:
          name: cli-release-evidence
      - name: Publish from public source with npm provenance
        if: inputs.dry_run != true && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          tgz=$(node -p "require('./pack.json')[0].filename")
          version=$(node -p "require('./pack.json')[0].version")
          # The private workflow pushes this source, then attaches immutable scanner
          # assets and publishes the release. This run starts on the push, so the
          # release can still be a draft, and GitHub keeps answering 404 for a
          # short while after it is published (public run 35294870622: the assets
          # were attached at 01:19:48Z, the release published at 01:20:08Z, and a
          # one-minute retry ending at 01:21:06Z saw nothing but 404). Poll for
          # up to ten minutes, then fail.
          asset="https://github.com/JayDeeCo-Limited/mnemonik-cli/releases/download/scanner-v$version/digests.json"
          for attempt in {1..120}; do
            if curl --fail --silent --show-error --location "$asset" -o scanner-digests.json; then
              echo "scanner release assets served on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              echo "scanner-v$version digests.json was not served within ten minutes" >&2
              exit 1
            fi
            sleep 5
          done
          node -e "const fs=require('fs'),c=require('crypto'); if(c.createHash('sha256').update(fs.readFileSync('scanner-digests.json')).digest('hex')!==require('./scanner-release.json').digestsSha256) process.exit(1)"
          npm publish "$tgz" --access public --provenance
          # npm accepts a publish before its read path serves the version, and
          # it does not bound how long that takes ("may take a few minutes").
          # Public run 35103666890 published 7.99.2 and then failed the job on
          # an E404 readback of the version it had just published. Poll for
          # fifteen minutes, then fail. The comparison stays fatal because it
          # is the only check that what users install is what was packed here.
          packed_integrity=$(node -p "require('./pack.json')[0].integrity")
          for attempt in {1..180}; do
            live_integrity=$(npm view "@mnemonik/cli@$version" dist.integrity 2>/dev/null || true)
            if [ -n "$live_integrity" ]; then
              if [ "$live_integrity" != "$packed_integrity" ]; then
                echo "::error::@mnemonik/cli@$version serves integrity $live_integrity, packed $packed_integrity"
                exit 1
              fi
              echo "OK    @mnemonik/cli@$version is live on the registry with matching integrity"
              break
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "::error::@mnemonik/cli@$version did not appear on the registry after publish."
              exit 1
            fi
            sleep 5
          done
